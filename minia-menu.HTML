<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو كافتيريا جامعة المنيا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5fb;--card:#fff;--ink:#14304f;--mut:#5f7791;--acc:#1d6fa8;--gold:#b8893b;--line:#d6e4f0;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b2a;--card:#162a3f;--ink:#e8f1fa;--mut:#9bb3c9;--acc:#5cb0e6;--gold:#e0b563;--line:#2a4560;--chip:#162a3f}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}
.hero{margin:0 -14px}
.hero img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}
@media(min-width:900px){.hero{margin:14px 0 0;border-radius:18px;overflow:hidden}}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:500 16px "Cairo",sans-serif}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:20px;padding:5px 15px;font:600 14px "Cairo",sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin-top:26px}
.cat h2{font:700 26px "Reem Kufi","Cairo",serif;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;color:var(--ink)}
.cat h2 small{font:500 14px "Cairo",sans-serif;color:var(--gold);direction:ltr}
.cat hr{border:0;height:2px;background:linear-gradient(to left,var(--gold),transparent);margin:0 0 6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.item .nm{flex:1;min-width:0}
.item .ar{font-weight:700;font-size:17px}
.item .en{display:block;font-size:13px;color:var(--mut);direction:ltr;text-align:right}
.item .pr{flex:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:3px 14px;font-weight:700;font-size:16px;min-width:64px;text-align:center}
.pr i{font-style:normal;font-size:12px;margin-right:3px;opacity:.85}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.deliv{margin-top:34px;background:#f7c92b;color:#2b2200;border-radius:16px;padding:14px 18px;font-weight:700;text-align:center}
.deliv small{display:block;font-weight:500}
.wa{display:inline-block;margin-top:8px;background:#14304f;color:#fff;text-decoration:none;border-radius:20px;padding:5px 18px;font-weight:700}
.credit{text-align:center;margin:30px 0 10px;direction:ltr;font:500 15px "Reem Kufi","Cairo",sans-serif;letter-spacing:2px;color:var(--mut)}
.credit b{font-weight:700;letter-spacing:3px;color:var(--gold);text-shadow:0 0 6px var(--gold),0 0 16px var(--gold),0 0 28px var(--acc);animation:glow 2.8s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 4px var(--gold),0 0 10px var(--gold)}to{text-shadow:0 0 8px var(--gold),0 0 22px var(--gold),0 0 38px var(--acc)}}
@media(prefers-reduced-motion:reduce){.credit b{animation:none}}
</style>
</head>
